# [[group]]                                  # shared setup / teardown for checks that need the same thing (an emulator, a server)
# name = "emulator"
# setup = "bash tools/start_emulator.sh"
# teardown = "bash tools/stop_emulator.sh"

# ---------------------------------------------------------------------------------------------------------------------------- screenshots
[shots]
# dir      = ".portkit/shots/current"        # captures are written here
# baseline = ".portkit/shots/baseline"       # accepted images (game renders: keep them out of git)
threshold = 8                                # per-channel difference that makes a pixel "changed"
max_changed_pct = 0.3                        # a shot fails above this percentage of changed pixels

