# portkit manifest: the checks and screenshot shots of ONE game port. Format: portkit/PORTKIT.md. Run: python portkit/portkit.py check --list

[project]
name = "My game port"
root = "."                                   # relative to this file; commands run from here unless a check says `cwd`
# How a command STRING is run. List form because of spaces in paths. Windows with Git for Windows:
shell = ["C:/Program Files/Git/bin/bash.exe", "-c"]
# shell = ["bash", "-c"]                     # Linux / macOS
[project.env]                                # environment for every command
# GODOT = "C:/path/to/Godot_console.exe"

[defaults]
timeout = 600                                # seconds per command

# ---------------------------------------------------------------------------------------------------------------------------- checks
# A check passes when the exit code is in expect_exit (default [0]), no fail_regex matches the log, every pass_regex matches,
# and (count_regex, count_min) has enough matching lines. summary_regex: the last matching line is shown (group 1 if there is one).
[[check]]
name = "unit"
desc = "unit tests of the core library"
cmd = "echo replace me"
tags = ["fast"]
pass_regex = ["replace me"]

