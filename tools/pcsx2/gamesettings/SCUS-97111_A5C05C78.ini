; Dark Cloud (USA) SCUS-97111, ELF CRC A5C05C78 - "remaster" settings.
; Applies only to this game. Edit in PCSX2: right-click the game > Properties.


[EmuCore]

; Built-in patches: 16:9 camera (nemesis2000) and no interlace offset.
; The no-interlacing patch also skips EdDrawDOF (depth-of-field blur); set false to keep the blur.
EnableWideScreenPatches = true
EnableNoInterlacingPatches = true


[EmuCore/GS]

; 4x native (about 2560x1792), downsampled to your 1080p screen = supersampled anti-aliasing.
; Use 6 for a 4K display.
upscale_multiplier = 4
MaxAnisotropy = 16

; Smoother, modern texture sampling: forced bilinear + trilinear, no PS2 dither pattern.
filter = 1
TriFilter = 2
dithering_ps2 = 0

; 3 = High blending accuracy (more correct transparency and lighting effects).
accurate_blending_unit = 3

; Contrast-adaptive sharpening to counter the downsampling softness.
CASMode = 1
CASSharpness = 40

; Picks up HD textures from textures\SCUS-97111\replacements once you have some.
LoadTextureReplacements = true

; Dump every texture the game uses to textures\SCUS-97111\dumps (turn off once you have enough).
DumpReplaceableTextures = false

